<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NagishoArts | Links</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="background-animation"></div>
    
    <div class="container">
        <!-- Profile Section -->
        <header class="profile">
            <div class="profile-img-container">
                <img src="assets/profile.jpg" alt="Emikos (NagishoArts)" class="profile-img">
            </div>
            <h1 class="profile-name">えみこす / Emikos</h1>
            <p class="profile-bio">筆文字アーティスト × UEインストラクター<br>感性と論理、スピリチュアルと現実を統合する</p>
        </header>

        <!-- Links Section -->
        <main class="links">
            <a href="https://emikos-laugh.github.io/NagishoArts/" target="_blank" class="link-card">
                <i class="fa-solid fa-globe icon"></i>
                <span class="link-text">NagishoArts Official Website</span>
            </a>
            
            <a href="https://lin.ee/TGI120y" target="_blank" class="link-card highlight">
                <i class="fa-brands fa-line icon"></i>
                <span class="link-text">LINE公式（お問い合わせ・教室）</span>
            </a>

            <a href="https://www.facebook.com/emiko.furuta888/" target="_blank" class="link-card">
                <i class="fa-brands fa-facebook icon"></i>
                <span class="link-text">Facebook (日々の活動)</span>
            </a>

            <a href="https://www.instagram.com/" target="_blank" class="link-card">
                <i class="fa-brands fa-instagram icon"></i>
                <span class="link-text">Instagram (作品ギャラリー)</span>
            </a>



            <a href="https://nagishoart.substack.com/" target="_blank" class="link-card">
                <i class="fa-regular fa-envelope icon"></i>
                <span class="link-text">Substack (メルマガ)</span>
            </a>
        </main>

        <!-- Footer -->
        <footer class="footer">
            <p>&copy; 2026 NagishoArts. All Rights Reserved.</p>
        </footer>
    </div>
</body>
</html>
